# Configuration for Supply Chain AI background services

# Intervals for scheduler jobs (can be overridden via environment variables)
# Values are in seconds for inventory scan and minutes for MAPE scan.

inventory_interval_seconds: 60
mape_interval_minutes: 5
supplier_evaluation_interval_minutes: 60
drift_agent_interval_hours: 24
daily_digest_interval_hours: 24

