# docker-compose.yml
#
# Services:
#   - Postgres (with pgvector) — the data layer
#   - FastMCP server (port 8000) — tool API for LangGraph agents
#   - Allocation Agent (port 8001) — A2A FastAPI service
#   - Replenishment Agent (port 8002) — A2A FastAPI service
#   - Dashboard API (port 8003) — proposal CRUD + APScheduler monitor
#   - LangGraph Agent (port 8004) — supervisor graph /invoke + /resume  [Day 4]
#
# docker-compose gives us a single `docker-compose up` to start everything
# with correct networking, ports, and env vars.
# In production you'd use Kubernetes or ECS.
#
# DB credentials: read from .env file (see .env.example).
# Defaults are provided inline for dev convenience, but .env takes precedence.

services:
  # ─────────────────────────────────────────────
  # POSTGRES + PGVECTOR
  #
  # WHY pgvector as an extension vs a separate vector DB?
  # Your supply chain data lives in Postgres already.
  # pgvector lets you do: WHERE region = 'Southeast' ORDER BY embedding <-> $1
  # That's a vector similarity search WITH a SQL filter in ONE query.
  # A separate Pinecone/Qdrant would require two round trips + data sync.
  #
  # ankane/pgvector is the official Docker image with pgvector pre-installed.
  # ─────────────────────────────────────────────
  postgres:
    image: ankane/pgvector:latest
    container_name: supply_chain_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scai_password}
      POSTGRES_DB: ${POSTGRES_DB:-supply_chain}
    ports:
      - "5439:5432"         # expose on 5439 to avoid collision with any local postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data   # persist data across restarts
      - ./data/seeds:/docker-entrypoint-initdb.d  # auto-run seed SQL on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scai -d supply_chain"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────
  # FASTMCP SERVER
  #
  # WHY a separate service and not just functions in the agent?
  # Central enforcement: RBAC, rate limiting, logging happen here.
  # Any client (LangGraph, A2A agents, future Claude plugin) calls the same server.
  # MCP is a protocol (like REST) — the server speaks it, clients consume it.
  # ─────────────────────────────────────────────
  mcp_server:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    container_name: supply_chain_mcp
    environment:
      DATABASE_URL: postgresql://scai:scai_password@postgres:5432/supply_chain
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MCP_SECRET: ${MCP_SECRET:-dev-secret-change-in-prod}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./mcp_server:/app   # mount source for hot reload during dev

  # ─────────────────────────────────────────────
  # ALLOCATION AGENT (A2A FastAPI service)
  #
  # WHY a separate FastAPI service and not just a LangGraph node?
  # In a real org, allocation logic might be owned by a different team.
  # A2A makes it independently deployable, testable, and scalable.
  # The Supervisor doesn't know the internals — it just sends a task payload
  # and polls for a result. This is Google's A2A protocol pattern.
  # ─────────────────────────────────────────────
  allocation_agent:
    build:
      context: ./services/allocation_agent
      dockerfile: Dockerfile
    container_name: allocation_agent
    environment:
      DATABASE_URL: postgresql://scai:scai_password@postgres:5432/supply_chain
      MCP_SERVER_URL: http://mcp_server:8000
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  # ─────────────────────────────────────────────
  # REPLENISHMENT AGENT (A2A FastAPI service)
  # ─────────────────────────────────────────────
  replenishment_agent:
    build:
      context: ./services/replenishment_agent
      dockerfile: Dockerfile
    container_name: replenishment_agent
    environment:
      DATABASE_URL: postgresql://scai:scai_password@postgres:5432/supply_chain
      MCP_SERVER_URL: http://mcp_server:8000
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy

  # ─────────────────────────────────────────────
  # DASHBOARD API (FastAPI service)
  #
  # WHY a separate service and not Next.js API routes directly?
  # Day 3 adds APScheduler background jobs inside this service:
  #   - 60s loop: scan inventory, auto-generate proposals on violations
  #   - 5min loop: scan MAPE, auto-generate forecast tuning proposals
  # Next.js cannot run persistent background jobs (it's serverless per route).
  # FastAPI runs as a long-lived process, perfect for schedulers.
  # ─────────────────────────────────────────────
  dashboard_api:
    build:
      context: ./services/dashboard_api
      dockerfile: Dockerfile
    container_name: supply_chain_dashboard_api
    environment:
      DATABASE_URL: postgresql://scai:scai_password@postgres:5432/supply_chain
      ALLOCATION_AGENT_URL: http://allocation_agent:8001
      REPLENISHMENT_AGENT_URL: http://replenishment_agent:8002
      LANGGRAPH_AGENT_URL: http://langgraph_agent:8004   # Day 4
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      langgraph_agent:
        condition: service_started   # soft dep — dashboard works even if agent is slow to start
    volumes:
      - ./services/dashboard_api:/app   # hot reload in dev
      - ./agents:/app/agents              # shared agents package from repo root

  # ─────────────────────────────────────────────
  # LANGGRAPH AGENT SERVICE (Day 4)
  #
  # HTTP wrapper around the LangGraph supervisor graph.
  # Exposes two endpoints:
  #   POST /invoke — start a new graph run, pause at HITL interrupt
  #                  returns thread_id stored on the proposal row
  #   POST /resume — unpause a graph with human decision (approved/rejected)
  #                  executes A2A actions if approved
  #
  # WHY a separate service?
  #   1. LangGraph runs make OpenAI API calls and A2A HTTP calls — I/O heavy,
  #      better isolated from the dashboard API's scheduling loop.
  #   2. Can scale independently as proposal volume grows.
  #   3. The checkpoint SQLite file lives here — single process, no race conditions.
  #      (In production: use PostgresSaver for multi-instance checkpoint sharing.)
  #
  # The agents/ package is mounted from the repo root so this service
  # shares the same graph code without duplication.
  # ─────────────────────────────────────────────
  langgraph_agent:
    platform: linux/amd64
    build:
      context: ./services/langgraph_agent
      dockerfile: Dockerfile
    container_name: supply_chain_langgraph_agent
    environment:
      DATABASE_URL: postgresql://scai:scai_password@postgres:5432/supply_chain
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ALLOCATION_AGENT_URL: http://allocation_agent:8001
      REPLENISHMENT_AGENT_URL: http://replenishment_agent:8002
      MCP_SERVER_URL: http://mcp_server:8000
      CHECKPOINT_DB: /tmp/supply_chain_checkpoints.db
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      # LangSmith tracing (Day 5)
      # Your shell env has LANG_SMITH_API_KEY — we map it to the name LangChain expects.
      # LANGCHAIN_TRACING_V2=true enables automatic tracing of all LLM calls and graph runs.
      # LANGCHAIN_PROJECT groups all runs under one project in the LangSmith UI.
      LANGCHAIN_API_KEY: ${LANG_SMITH_API_KEY}
      LANGCHAIN_TRACING_V2: "true"
      LANGCHAIN_PROJECT: supply-chain-ai
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
      allocation_agent:
        condition: service_started
      replenishment_agent:
        condition: service_started
    volumes:
      - ./services/langgraph_agent:/app   # hot reload in dev
      - ./agents:/app/agents              # shared agents package from repo root
      - langgraph_checkpoints:/tmp        # persist SQLite checkpoint DB across restarts
      - .:/Users/mythilikotaru/Documents/supply-chain-ai

  # ─────────────────────────────────────────────
  # CENTRALIZED LOGGING & OBSERVABILITY
  # ─────────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.2
    container_name: supply_chain_loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:2.9.2
    container_name: supply_chain_promtail
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:10.2.2
    container_name: supply_chain_grafana
    ports:
      - "3200:3000"
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - loki

volumes:
  pgdata:
    # named volume — Docker manages this, survives `docker-compose down`
    # use `docker-compose down -v` to also wipe the data (full reset)
  langgraph_checkpoints:
    # Persists the SQLite checkpoint DB across container restarts.
    # This means in-flight HITL approvals survive a langgraph_agent restart.
    # In production: switch to PostgresSaver (no SQLite, no volume needed).
